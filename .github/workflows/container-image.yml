# Builds the assistant's sandbox image (container/Dockerfile) for Apple Silicon / arm64 Linux and for
# Intel / amd64 Linux, and publishes it to the GitHub Container Registry as one multi-architecture image:
#
#   ghcr.io/<owner>/ai-assistant:<tag>      e.g. v1.0.0, and "latest" for release tags
#
# Run it by pushing a release tag (v*), or by hand from the Actions tab (publishes the "edge" tag). A fixable
# CRITICAL vulnerability in either image stops the release before the tag and "latest" are created.
# Each architecture is built on a native runner, not emulated: the build downloads and compiles things
# for the machine it runs on, and takes about 5 minutes on a GitHub runner.
#
# One-time setup by an org admin: allow this repository to publish packages, and after the first
# publish set the package's visibility to public so that `container/kyverno` can pull it without logging in.
name: container-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - name: Work out the image name and tag
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="edge"; fi
          echo "image=ghcr.io/${owner}/ai-assistant" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build fails by design if the memory plugin cannot load or needs the network (see the Dockerfile).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}-${{ matrix.arch }}

  manifest:
    name: publish ${{ needs.build.outputs.tag }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate: nothing is released while the image has a fixable CRITICAL vulnerability. Both architectures are
      # scanned, as the per-architecture tags pushed above; "latest" and the release tag do not exist yet, so a
      # failure here leaves the previous release in place. Trivy runs as a container pinned by digest (0.76.0).
      - name: Scan for critical vulnerabilities
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for arch in amd64 arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${TAG}-${arch}"
          done

      - name: Combine the two architectures into one image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          tags=(-t "${IMAGE}:${TAG}")
          # Only a release tag moves "latest"; a manual run publishes "edge" and leaves it alone.
          [ "${GITHUB_REF_TYPE}" = "tag" ] && tags+=(-t "${IMAGE}:latest")
          docker buildx imagetools create "${tags[@]}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
