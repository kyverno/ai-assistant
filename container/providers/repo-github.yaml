# OpenShell provider profile for the repo-scoped GitHub PAT. The sandbox only ever holds a
# placeholder in REPO_GITHUB_TOKEN; the gateway's proxy swaps in the real value on requests to the
# endpoints below, and only from the binaries listed. Import with:
#   openshell profile import -f container/providers/repo-github.yaml
id: kyverno-repo-github
display_name: Kyverno assistant repo token
description: Repo-scoped GitHub PAT for the Kyverno assistant (read APIs plus the GitHub MCP server)
category: source_control
credentials:
  - name: repo_token
    description: Fine-grained PAT scoped to the repo the assistant manages
    env_vars: [REPO_GITHUB_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [repo_token]
endpoints:
  # REST and GraphQL reads only. GraphQL mutations, including mergePullRequest, are refused here.
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.github.com
    port: 443
    path: /graphql
    protocol: graphql
    access: read-only
    enforcement: enforce
  # The hosted GitHub MCP server. Which tools exist is decided by the X-MCP-Tools header in config.yaml.
  # Only /mcp/ gets the token; Copilot inference on the same host carries its own bearer and gets none.
  - host: api.githubcopilot.com
    port: 443
    path: /mcp/
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/mcp/**" }
      - allow: { method: POST, path: "/mcp/**" }
      - allow: { method: DELETE, path: "/mcp/**" }
binaries:
  # Hermes' interpreter. The directory name carries the Python version and build date, hence the glob.
  - /opt/hermes-home/.hermes/tools/python-*/bin/python*
